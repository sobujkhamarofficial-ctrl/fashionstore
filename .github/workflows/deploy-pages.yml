name: Deploy FORME to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Men category pages
        run: |
          mkdir -p men
          cp index.html men/index.html
          for category in half-sleeve-t-shirt full-sleeve-t-shirt polo-t-shirt shirt panjabi hoodie jacket sweatshirt comfy-trouser sports-trouser jeans joggers cargo-pants chino-pants shorts pajama face-mask underwear socks wallet belt cap; do
            mkdir -p "men/$category"
            cp index.html "men/$category/index.html"
          done

      - name: Upload static storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

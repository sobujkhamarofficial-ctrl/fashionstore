name: Deploy FORME to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generate Men's product pages
        run: python3 scripts/build_men_catalog.py
      - name: Verify Men's products
        run: |
          test -s men/index.html
          test -s men/men-pages.css
          test -s men/catalog.json
          test -s men/men/index.html
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          cats = json.loads(Path("men/catalog.json").read_text())["categories"]
          assert len(cats) == 23
          total = 0
          all_ids = []
          for c in cats:
              p = Path("men") / c["slug"] / "index.html"
              assert p.is_file() and p.stat().st_size > 1000, str(p)
              body = p.read_text()
              products = c["products"]
              assert len(products) >= 1, c["slug"]
              expected = [item["product_id"] for item in products]
              assert all(expected), f"Missing database product IDs: {c['slug']}"
              assert len(expected) == len(set(expected)), f"Duplicate IDs inside {c['slug']}"
              assert all(item.get("availability_status") == "needs_confirmation" for item in products), c["slug"]
              add_ids = re.findall(r'data-f-add="([^"]+)"', body)
              buy_ids = re.findall(r'data-f-buy-now="([^"]+)"', body)
              assert add_ids == expected, f"Add to Cart IDs do not match database products: {c['slug']}"
              assert buy_ids == expected, f"Buy Now IDs do not match database products: {c['slug']}"
              assert body.count('class="f-product f-static-product"') == len(products), c["slug"]
              assert 'assets/commerce-actions.js' in body, f"Missing commerce runtime: {c['slug']}"
              assert 'assets/image-viewer.js' in body and 'assets/image-viewer.css' in body, f"Missing image viewer: {c['slug']}"
              all_ids.extend(expected)
              total += len(products)
          assert len(all_ids) == len(set(all_ids)), "Duplicate database product IDs across Men categories"
          assert total == 133, total
          assert Path("men/index.html").read_text().count('class="f-men-category-link"') == 23
          print(f"Verified 23 categories, {total} DB-linked products, and matching Buy Now / Add to Cart IDs.")
          PY

      - name: Download real, licensed fashion photography
        run: python3 scripts/download_fashion_photos.py

      - name: Generate Women, Teens, Kids, Sports and Accessories pages
        run: python3 scripts/build_collection_pages.py
      - name: Build FORME policy, information and journal pages
        run: python3 scripts/build_store_content.py
      - name: Build long-form Bengali Blog articles
        run: python3 scripts/build_blog.py
      - name: Verify five-level category hierarchy pages
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("collections/catalog.json").read_text())
          departments = data["departments"]
          assert len(departments) == 5
          pages = image_count = 0
          groups = categories = subcategories = nested = 0
          seen_paths = set()
          expected_kinds = ("top", "bottoms", "outerwear", "wallet", "cap", "socks", "belt", "dress", "bag", "jewelry", "shoes", "sports", "kids")
          expected_assets = {f"{kind}-{index:02d}.jpg" for kind in expected_kinds for index in range(1, 7)}
          asset_dir = Path("assets/fashion-photos")
          actual_assets = {item.name for item in asset_dir.glob("*.jpg")}
          assert expected_assets.issubset(actual_assets), f"Missing photos: {sorted(expected_assets - actual_assets)}"
          for filename in expected_assets:
              payload = (asset_dir / filename).read_bytes()
              assert len(payload) > 8000, f"Photo is too small: {filename}"
              assert payload.startswith(b"\xff\xd8\xff"), f"Photo is not JPEG: {filename}"

          def verify_page(path):
              global pages, image_count
              assert path.is_file() and path.stat().st_size > 1000, str(path)
              key = path.as_posix()
              assert key not in seen_paths, f"Duplicate page path: {key}"
              seen_paths.add(key)
              body = path.read_text()
              sources = re.findall(r'<img class="gallery-image" src="([^"]+)"', body)
              order_buttons = re.findall(r'class="visual-order-button"[^>]*data-catalogue-order', body)
              assert len(sources) == 6, f"Expected 6 gallery photos in {key}; found {len(sources)}"
              assert len(set(sources)) == 6, f"Expected six different photos in {key}"
              assert len(order_buttons) == 6, f"Every gallery photo must have an Order Now control in {key}"
              assert 'visual-image-link' not in body, f"Gallery photo still navigates away in {key}"
              assert 'visual-action' not in body, f"Old Explore/photo action remains in {key}"
              assert 'target="_blank"' not in body, f"Gallery page must stay on FORME: {key}"
              assert 'catalogue-orders.js' in body, f"Catalogue order runtime missing in {key}"
              assert 'image-viewer.js' in body and 'image-viewer.css' in body, f"Image viewer missing in {key}"
              assert 'Continue exploring' not in body, f"Sibling loop navigation remains in {key}"
              for source in sources:
                  prefix = "/fashionstore/assets/fashion-photos/"
                  assert source.startswith(prefix), f"Unexpected image source in {key}: {source}"
                  relative = source.split("/fashionstore/", 1)[1]
                  photo_path = Path(relative)
                  assert photo_path.is_file(), f"Photo missing from deployment bundle: {relative}"
                  assert photo_path.stat().st_size > 8000, f"Empty photo file: {relative}"
                  image_count += 1
              pages += 1

          for department in departments:
              d = Path(department["slug"])
              verify_page(d / "index.html")
              for group in department["groups"]:
                  g = d / group["slug"]
                  verify_page(g / "index.html")
                  groups += 1
                  for category in group["categories"]:
                      c = g / category["slug"]
                      verify_page(c / "index.html")
                      categories += 1
                      assert category["subcategories"], category["title"]
                      for subcategory in category["subcategories"]:
                          s = c / subcategory["slug"]
                          verify_page(s / "index.html")
                          subcategories += 1
                          assert len(subcategory["subcategories"]) == 4, subcategory["title"]
                          for nested_category in subcategory["subcategories"]:
                              n = s / nested_category["slug"]
                              verify_page(n / "index.html")
                              nested += 1

          assert (groups, categories, subcategories, nested) == (26, 104, 416, 1664)
          assert pages == 2215, pages
          assert len(seen_paths) == 2215
          assert image_count == 13290, image_count
          print(f"Verified {pages} pages and {image_count} real-photo placements using 78 local photographs: 5 departments, {groups} groups, {categories} categories, {subcategories} sub-categories and {nested} nested sub-categories.")
          PY

      - name: Verify department dropdown navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          home = Path("index.html").read_text()
          assert home.count('class="f-native-mega"') >= 6, "Homepage desktop menus are incomplete"
          assert home.count('class="f-mobile-categories"') >= 6, "Homepage mobile menus are incomplete"

          Path("men/index.html").read_text()
          men_page = Path("men/index.html").read_text()
          assert men_page.count('class="f-native-mega"') >= 6, "Men page desktop dropdowns are incomplete"

          data = json.loads(Path("collections/catalog.json").read_text())
          for department in data["departments"]:
              page = Path(department["slug"]) / "index.html"
              body = page.read_text()
              assert body.count('class="nav-dropdown"') == 6, str(page)
              assert "nav-mega" in body, str(page)

          print("Verified 6 department dropdowns on homepage, Men pages and all 5 collection landing pages.")
          PY
      - name: Verify every generated internal link and local image
        run: python3 scripts/verify_storefront.py
      - name: Verify ecommerce, policies and journal integration
        run: |
          node --check assets/admin.js
          node --check assets/order-tracking.js
          node --check assets/checkout.js
          node --check assets/blog.js
          node --check assets/catalogue-orders.js
          node --check assets/cart-page.js
          node --check assets/image-viewer.js
          node --check assets/order-tracking.js
          node --check assets/order-confirmation.js
          node --check assets/catalogue-order-page.js
          node --check assets/catalogue-live.js
          node --check assets/catalogue-orders.js
          node --check assets/reviews.js
          node --check assets/site-forms.js
          node --check assets/commerce-actions.js
          node --check assets/customer-care.js
          node --check assets/customer-live-voice.js
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              "pages/checkout.html",
              "pages/cart.html",
              "assets/cart-page.js",
              "assets/cart-page.css",
              "assets/image-viewer.js",
              "assets/image-viewer.css",
              "pages/order-tracking.html",
              "pages/order-confirmation.html",
              "pages/catalogue-order.html",
              "assets/order-tracking.js",
              "assets/order-confirmation.js",
              "assets/catalogue-order-page.js",
              "assets/catalogue-live.js",
              "assets/catalogue-live.css",
              "assets/commerce-actions.js",
              "assets/commerce-actions.css",
              "assets/reviews.js",
              "pages/about.html",
              "pages/shipping-delivery.html",
              "pages/returns-refunds.html",
              "pages/privacy.html",
              "pages/terms.html",
              "pages/payment.html",
              "pages/cancellations.html",
              "pages/size-guide.html",
              "pages/faq.html",
              "pages/contact.html",
              "blog/index.html",
              "blog/bangladesh-capsule-wardrobe-guide.html",
              "blog/shirt-fit-size-measurement-bangladesh.html",
              "blog/fabric-guide-hot-humid-weather.html",
              "blog/mens-wardrobe-essentials-bangladesh.html",
              "blog/womens-everyday-wardrobe-bangladesh.html",
              "blog/jeans-trouser-fit-guide.html",
              "blog/colour-coordination-outfit-guide.html",
              "blog/clothing-care-wash-store.html",
              "blog/online-fashion-shopping-checklist.html",
              "blog/buy-better-responsible-wardrobe.html",
              "blog/tshirt-fit-neckline-style-guide.html",
              "blog/panjabi-fit-fabric-occasion-guide.html",
              "blog/kurti-salwar-kameez-fit-style-guide.html",
              "blog/saree-fabric-drape-blouse-style-guide.html",
              "blog/monsoon-clothing-layering-care-bangladesh.html",
              "blog/office-workwear-capsule-style-guide.html",
              "blog/activewear-fit-fabric-training-clothing-guide.html",
              "blog/fashion-accessories-bag-belt-scarf-style-guide.html",
              "blog/kids-clothing-size-comfort-safety-care-guide.html",
              "blog/shoe-size-fit-material-care-guide.html",
              "blog/cotton-linen-viscose-polyester-fabric-comparison.html",
              "blog/tshirt-vs-polo-vs-casual-shirt-comparison.html",
              "blog/jeans-vs-chinos-vs-formal-trousers-comparison.html",
              "blog/sneakers-vs-loafers-vs-formal-shoes-comparison.html",
              "blog/online-vs-in-store-clothing-shopping-comparison.html",
              "scripts/build_blog.py",
              "content/blog_posts_part1.json",
              "content/blog_posts_part2.json",
              "content/blog_posts_part3.json",
              "content/blog_posts_part4.json",
              "content/blog_posts_part5.json",
              "content/blog_posts_part6.json",
              "content/blog_posts_part7.json",
              "assets/blog.css",
              "assets/blog.js",
              "assets/content-pages.css",
              "assets/checkout.js",
              "assets/catalogue-orders.js",
              "assets/catalogue-orders.css",
              "assets/site-forms.js",
              "assets/customer-care.js",
              "assets/customer-care.css",
              "sitemap.xml",
              "robots.txt",
          ]
          for item in required:
              path = Path(item)
              minimum_size = 20 if item == "robots.txt" else 500
              assert path.is_file() and path.stat().st_size > minimum_size, f"Missing/empty ecommerce asset: {item}"

          home = Path("index.html").read_text()
          assert 'pages/cart.html' in home, "Home bag does not lead to cart review"
          assert 'assets/site-forms.js' in home, "Home newsletter is not connected"
          assert 'blog/bangladesh-capsule-wardrobe-guide.html' in home, "Home Blog preview is missing"
          assert '<b>Blog</b>' in home and 'FORME Journal' not in home, "Homepage footer Blog section is missing or still named Journal"
          header = home.split('</header>', 1)[0]
          assert '/blog/' not in header, "Blog must not be added to the homepage header navigation"
          sources = sorted(Path("content").glob("blog_posts_part*.json"))
          posts = []
          for source in sources:
              posts.extend(json.loads(source.read_text(encoding="utf-8")))
          assert len(posts) in (10, 20, 25, 30), f"Expected 10, 20, 25 or 30 blog articles, got {len(posts)}"
          blog_index = Path('blog/index.html').read_text()
          assert blog_index.count('class="fb-card"') == len(posts), "Blog index card count does not match published articles"
          assert 'fb-search' in blog_index and 'data-blog-filter' in blog_index, "Blog search and topic filters are missing"
          assert 'FORME Blog' in blog_index, "Blog index title is missing"
          seen_slugs = set()
          for post in posts:
              assert post['slug'] not in seen_slugs, f"Duplicate blog slug: {post['slug']}"
              seen_slugs.add(post['slug'])
              body_text = " ".join([paragraph for section in post['sections'] for paragraph in section['p']] + [example[1] for example in post['examples']] + [answer for _, answer in post['faqs']])
              word_count = len(re.findall(r"\S+", body_text))
              minimum_words = 2800 if "তুলনা" in post.get("category", "") else 3000
              assert minimum_words <= word_count <= 4000, f"{post['slug']} has {word_count} body words (minimum {minimum_words})"
              article_path = Path("blog") / (post['slug'] + ".html")
              assert article_path.is_file(), f"Missing generated article: {article_path}"
              article_html = article_path.read_text(encoding="utf-8")
              assert 'application/ld+json' in article_html and 'fb-toc' in article_html and 'common-questions' in article_html, f"Article structure/SEO missing: {article_path}"
          assert '<h3>Blog</h3>' in Path('pages/cart.html').read_text() and '<h3>Blog</h3>' in Path('pages/checkout.html').read_text(), "Cart and checkout footer Blog links are missing"
          assert '/blog/' not in Path('pages/cart.html').read_text().split('</header>', 1)[0], "Blog must not be in cart header navigation"
          assert '/blog/' not in Path('pages/checkout.html').read_text().split('</header>', 1)[0], "Blog must not be in checkout header navigation"
          assert "<strong>Blog</strong>" in Path("404.html").read_text(), "Not-found page footer Blog section is missing"
          assert "<h3>Blog</h3>" in Path("pages/contact.html").read_text(), "Information-page footer Blog section is missing"
          assert 'assets/customer-care.js' in home, "AI chat bundle must load on the homepage"
          assert 'data-f-buy-now="f1"' in home and 'data-f-add="f1"' in home, "Featured product purchase controls are missing"
          assert 'data-f-buy-now="' in home, "Men product Buy Now template is missing"

          cart_page = Path("pages/cart.html").read_text()
          assert "forme-cart-v1" in Path("assets/cart-page.js").read_text()
          assert "fc-bag-items" in cart_page and "fc-bag-checkout" in cart_page
          assert "pages/checkout.html" in Path("assets/cart-page.js").read_text()
          assert "forme-cart-v1" in Path("assets/checkout.js").read_text()
          checkout = Path("pages/checkout.html").read_text()
          assert "privacy_consent" in checkout and "terms_accepted" in checkout
          tracking = Path("pages/order-tracking.html").read_text()
          assert "order_number" in tracking and "customer_phone" in tracking
          assert "assets/order-tracking.js" in tracking
          assert "lookup_store_order" in Path("assets/order-tracking.js").read_text() or "action:\"track\"" in Path("assets/order-tracking.js").read_text()
          reviews = Path("pages/reviews.html").read_text()
          assert "publication_consent" in reviews and "delivered" in reviews.lower()
          assert "assets/reviews.js" in reviews
          assert "No payment is collected" in checkout
          catalogue_runtime = Path("assets/catalogue-orders.js").read_text()
          catalogue_form_runtime = Path("assets/catalogue-order-page.js").read_text()
          assert "catalogue-order.html" in catalogue_runtime and "data-catalogue-order" in catalogue_runtime
          assert "অর্ডার রিকোয়েস্ট পাঠান" in catalogue_form_runtime and 'action:"catalogue-order"' in catalogue_form_runtime
          catalogue_page = Path("pages/catalogue-order.html").read_text()
          confirmation_page = Path("pages/order-confirmation.html").read_text()
          assert "fc-catalogue-order-form" in catalogue_page and "catalogue-order-page.js" in catalogue_page
          assert "fc-order-reference" in confirmation_page and "order-confirmation.js" in confirmation_page
          assert "data-catalogue-order" in Path("scripts/build_collection_pages.py").read_text()
          assert "catalogue-orders.js" in Path("scripts/build_collection_pages.py").read_text()
          assert "catalogue-orders.js" in home and "catalogue-orders.css" in home, "Homepage catalogue requests are not connected"
          assert "data-catalogue-order" in home, "Homepage preview items are missing an Order Now control"
          assert "assets/catalogue-live.js" in home and "assets/catalogue-live.css" in home, "Homepage is missing live product catalogue sync"
          assert "assets/commerce-actions.js" in home and "assets/commerce-actions.css" in home, "Homepage is missing the shared cart runtime"
          assert "FORME_CART_API" in home, "Homepage cart is not connected to the shared runtime"
          assert "catalogue-live.js" in Path("scripts/build_men_catalog.py").read_text(), "Men pages are missing live product catalogue sync"
          admin_html = Path("admin/index.html").read_text()
          admin_js = Path("assets/admin.js").read_text()
          assert "fa-product-export" in admin_html and "fa-product-import" in admin_html, "Admin CSV controls are missing"
          assert "product-bulk-update" in admin_js and "parseCsv" in admin_js, "Admin bulk product import is not connected"
          assert Path("assets/catalogue-orders.css").is_file(), "Catalogue order modal styles are missing"
          commerce = Path("assets/checkout.js").read_text()
          assert "storefront-commerce-api" in commerce and "AQ." not in commerce
          forms = Path("assets/site-forms.js").read_text()
          assert 'action: "contact"' in forms and 'action: "newsletter"' in forms
          assert "order-tracking" in Path("scripts/build_store_content.py").read_text()
          assert "p_fingerprint" in Path("assets/checkout.js").read_text() or "storefront-commerce-api" in Path("assets/checkout.js").read_text()
          assert 'marketing_consent' in forms, "Newsletter consent must be checked before subscription"
          assert 'p_consent' in Path("assets/checkout.js").read_text() or 'marketing_consent' in forms
          for policy in ["pages/shipping-delivery.html","pages/returns-refunds.html","pages/privacy.html","pages/terms.html","pages/payment.html","pages/cancellations.html"]:
              assert "বাংলা সংস্করণ" in Path(policy).read_text(), f"Missing Bengali policy text: {policy}"

          men_builder = Path("scripts/build_men_catalog.py").read_text()
          collection_builder = Path("scripts/build_collection_pages.py").read_text()
          assert "data-f-add" in men_builder and "data-f-buy-now" in men_builder and "commerce-actions.js" in men_builder
          assert "customer-care.js" in men_builder
          assert "customer-care.js" in collection_builder
          assert "commerce-actions.js" in collection_builder and "commerce-actions.css" in collection_builder
          assert "assets/blog.css" in men_builder and '<strong>Blog</strong>' in men_builder, "Men pages need a dedicated Blog footer"
          assert "assets/blog.css" in collection_builder and '<strong>Blog</strong>' in collection_builder, "Collection pages need a dedicated Blog footer"
          assert "<h3>Blog</h3>" in Path("scripts/build_store_content.py").read_text(), "Information page footer Blog section is missing"

          for page in ["pages/shipping-delivery.html","pages/returns-refunds.html","pages/privacy.html","pages/terms.html","blog/index.html"]:
              assert "FORME" in Path(page).read_text()
          print(f"Verified {len(required)} ecommerce assets/pages, twenty-five Bengali blog articles, including five 2,800–4,000-word comparison guides, Blog search/filter, footer-only Blog navigation, checkout controls and site APIs.")
          PY
      - name: Smoke test Supabase order API and database connection
        run: |
          python3 - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          ai_endpoint = "https://zfgcovvfczjiqagrnfjr.supabase.co/functions/v1/fashion-customer-care"
          with urlopen(ai_endpoint, timeout=25) as response:
              ai_status = json.loads(response.read().decode("utf-8"))
              assert response.status == 200 and ai_status.get("status") in {"paused", "ready", "configured"}, ai_status

          voice_endpoint = "https://zfgcovvfczjiqagrnfjr.supabase.co/functions/v1/fashion-live-voice-token"
          with urlopen(voice_endpoint, timeout=25) as response:
              voice_status = json.loads(response.read().decode("utf-8"))
              assert response.status == 200 and voice_status.get("service") == "FORME Live Voice Token", voice_status
              assert voice_status.get("model") == "models/gemini-3.8-live", voice_status
              assert voice_status.get("status") in {"configured", "paused"}, voice_status

          endpoint = "https://zfgcovvfczjiqagrnfjr.supabase.co/functions/v1/storefront-commerce-api"
          with urlopen(endpoint, timeout=25) as response:
              health = json.loads(response.read().decode("utf-8"))
              assert response.status == 200 and health.get("status") == "ready", health

          # Give each workflow run a distinct test contact so persistent rate limits
          # from previous successful runs cannot make this smoke test fail.
          import os
          run_id = os.environ.get("GITHUB_RUN_ID", "00000000")
          phone = "019" + run_id[-8:].zfill(8)

          payload = {
              "action": "order",
              "order": {
                  "customer_name": "FORME automated deployment check",
                  "customer_phone": phone,
                  "customer_email": "",
                  "delivery_address": "Deployment check address, test only",
                  "district": "Dhaka",
                  "area": "Test",
                  "postal_code": "",
                  "customer_note": "Automated smoke test; this request must roll back.",
                  "privacy_consent": True,
                  "terms_accepted": True,
                  "items": [{"product_id": "__ci_invalid_product__", "quantity": 1}]
              }
          }
          request = Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=30) as response:
                  status = response.status
                  body = json.loads(response.read().decode("utf-8"))
          except HTTPError as error:
              status = error.code
              body = json.loads(error.read().decode("utf-8"))

          assert status == 400, {"status": status, "body": body}
          assert "not available" in body.get("error", "").lower(), body
          print("Supabase commerce API reached the database; invalid test product was safely rejected.")

          track_payload = {
              "action": "track",
              "order_number": "FRM-CI-" + run_id,
              "customer_phone": phone,
          }
          track_request = Request(
              endpoint,
              data=json.dumps(track_payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(track_request, timeout=30) as response:
                  track_status = response.status
                  track_body = json.loads(response.read().decode("utf-8"))
          except HTTPError as error:
              track_status = error.code
              track_body = json.loads(error.read().decode("utf-8"))

          assert track_status == 400, {"status": track_status, "body": track_body}
          assert "could not find" in track_body.get("error", "").lower(), track_body
          print("Order tracking API reached the database and safely rejected an unknown order.")
          PY
      - name: Validate Python build scripts
        run: python3 -m py_compile scripts/build_collection_pages.py scripts/build_men_catalog.py scripts/download_fashion_photos.py scripts/build_store_content.py scripts/build_blog.py scripts/verify_storefront.py
      - name: Verify branded not-found page and image fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          not_found = Path("404.html").read_text()
          assert "FORME COLLECTIONS" in not_found
          assert "renderDepartmentPage" in not_found
          assert "form-product-sheet" in not_found, "Men placeholder sheets are missing"
